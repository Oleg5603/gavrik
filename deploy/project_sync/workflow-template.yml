name: Gavrik maintenance tests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  gavrik-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s deploy/project_sync/tests -v
